# Builds the browser (WebGL) version of the game and publishes it to GitHub Pages, so
# https://eurekaorwhatever.github.io/ChibiSmashUnity/ always serves the latest main.
# Runs on every push to main (any change that reaches main: local edits, Claude Code + Unity MCP, merged PRs)
# and on demand (Actions > web-build > Run workflow).
#
# One-time setup by the repository owner (see tools/ci/README.md, "Web build / GitHub Pages"):
#   1. Secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (the same ones tests.yml uses).
#   2. Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Without the secrets the job is skipped with a notice and the published site stays as it was.
name: web-build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "production/**"
      - "studio-tests/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued older build so the site ends on the latest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      built: ${{ steps.lic.outputs.have }}
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      # game-ci needs all three for a Personal licence. Name any missing one instead of failing later with
      # "No valid license activation strategy could be determined".
      - name: Check Unity licence secrets
        id: lic
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice title=Web build skipped::Missing repository secret(s):$missing. The game was not built or published. See tools/ci/README.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      # The Unity editor image and an IL2CPP WebGL build need more disk than the runner has free by default.
      - name: Free disk space
        if: steps.lic.outputs.have == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Importing the large stage and animation textures and the IL2CPP WebGL link need more memory than the runner's
      # RAM: run #7 was killed with exit code 137 (out of memory) after 14 minutes. A big swap file on the runner's
      # spare /mnt disk lets it finish (slower, but it does not get killed).
      - name: Add swap space
        if: steps.lic.outputs.have == 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h / /mnt

      - uses: actions/checkout@v4
        if: steps.lic.outputs.have == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.lic.outputs.have == 'true'
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        if: steps.lic.outputs.have == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build
          buildMethod: ChibiClash.EditorTools.WebBuild.BuildFromCommandLine

      - name: Locate the built site
        if: steps.lic.outputs.have == 'true'
        id: site
        # The build runs in game-ci's container as root, so build/ is root-owned: take ownership before touching it
        # (run #8 built fine and then failed here on a permission error). WebBuild.cs already writes .nojekyll.
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          index=$(find build -name index.html -print -quit)
          if [ -z "$index" ]; then echo "::error::No index.html in the WebGL build output"; find build -maxdepth 3; exit 1; fi
          dir=$(dirname "$index")
          [ -f "$dir/.nojekyll" ] || touch "$dir/.nojekyll"
          echo "Site folder: $dir"; du -sh "$dir"; ls -la "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.lic.outputs.have == 'true'
        with:
          path: ${{ steps.site.outputs.dir }}

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
