# Runs every EditMode test (incl. the netcode contract tripwires) on each push and pull request.
# One-time setup by the repository owner: add the secrets UNITY_LICENSE (contents of your .ulf),
# UNITY_EMAIL and UNITY_PASSWORD under GitHub > Settings > Secrets and variables > Actions.
# Guide: https://game.ci/docs/github/activation
name: tests

on:
  push:
    branches: [main]
  pull_request:

# unity-test-runner publishes its results as a check run ("EditMode tests"), which needs checks: write.
permissions:
  contents: read
  checks: write

jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check Unity licence secrets
        id: lic
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice title=Unity tests skipped::UNITY_LICENSE secret is not set; EditMode tests did not run. See tools/ci/README.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.have == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: steps.lic.outputs.have == 'true'
        with:
          path: Library
          # Same WebGL target as the web build, so its imported Library (Library-WebGL-...) is a valid warm start.
          key: Library-EditModeTests-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-EditModeTests-WebGL-
            Library-WebGL-
      # Same as the web build: importing the large game textures needs more memory and disk than the runner has.
      - name: Free disk space
        if: steps.lic.outputs.have == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - name: Add swap space
        if: steps.lic.outputs.have == 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; df -h / /mnt
      # game-ci/unity-test-runner never started Unity on this project (runs 19-31: "Unity wrote no editor log"), while
      # game-ci/unity-builder works for the web build with the same secrets. So the tests run through the builder,
      # calling ChibiClash.EditorTools.CiTests.RunEditMode (Assets/ChibiClash/Editor/CiTests.cs), which exits 1 on any
      # failed test. The WebGL target reuses the web build's Docker image.
      - name: Run EditMode tests
        id: tests
        if: steps.lic.outputs.have == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build
          buildMethod: ChibiClash.EditorTools.CiTests.RunEditMode
          customParameters: -ciTestsOut /github/workspace/artifacts
      # The Actions log needs a GitHub sign-in to read; annotations do not. Publish the summary and each failing test.
      - name: Publish the test results
        if: always() && steps.lic.outputs.have == 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts 2>/dev/null || true
          if [ -f artifacts/editmode-summary.txt ]; then echo "::notice title=EditMode tests::$(cat artifacts/editmode-summary.txt)"; else echo "::error title=EditMode tests::No test summary was written (Unity did not reach the tests)."; fi
          if [ -s artifacts/editmode-failures.txt ]; then head -n 20 artifacts/editmode-failures.txt | while IFS= read -r line; do echo "::error title=Failed test::${line:0:900}"; done; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.lic.outputs.have == 'true'
        with:
          name: test-results
          path: artifacts
