# Runs every EditMode test (incl. the netcode contract tripwires) on each push and pull request.
# One-time setup by the repository owner: add the secrets UNITY_LICENSE (contents of your .ulf),
# UNITY_EMAIL and UNITY_PASSWORD under GitHub > Settings > Secrets and variables > Actions.
# Guide: https://game.ci/docs/github/activation
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
