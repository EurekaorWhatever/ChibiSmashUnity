# Runs every EditMode test (incl. the netcode contract tripwires) on each push and pull request.
# One-time setup by the repository owner: add the secrets UNITY_LICENSE (contents of your .ulf),
# UNITY_EMAIL and UNITY_PASSWORD under GitHub > Settings > Secrets and variables > Actions.
# Guide: https://game.ci/docs/github/activation
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check Unity licence secrets
        id: lic
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice title=Unity tests skipped::UNITY_LICENSE secret is not set; EditMode tests did not run. See tools/ci/README.md."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.have == 'true'
        with:
          lfs: true
      - uses: actions/cache@v4
        if: steps.lic.outputs.have == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        if: steps.lic.outputs.have == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode tests
      - uses: actions/upload-artifact@v4
        if: always() && steps.lic.outputs.have == 'true'
        with:
          name: test-results
          path: artifacts
